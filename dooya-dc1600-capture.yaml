  birth_message:
    topic: dooya/curtain/availability
    payload: online
    retain: true
  will_message:
    topic: dooya/curtain/availability
    payload: offline
    retain: true

  # Publish all states when MQTT connects (restored values don't trigger on_value)
  on_connect:
    - delay: 1s
    - script.execute: publish_all_states

  # Command topics for curtain control
  on_message:
    - topic: dooya/curtain/command
      then:
        - lambda: |-
            if (x == "OPEN") {
              id(handle_open).execute();
            } else if (x == "STOP") {
              id(handle_stop).execute();
            } else if (x == "CLOSE") {
              id(handle_close).execute();
            }

    - topic: dooya/schedule/command
      then:
        - lambda: |-
            if (x == "ON") {
              id(schedule_enabled).turn_on();
            } else if (x == "OFF") {
              id(schedule_enabled).turn_off();
            }

    - topic: dooya/schedule/partial_hour/set
      then:
        - lambda: |-
            int val = atoi(x.c_str());
            if (val >= 0 && val <= 23) {
              auto call = id(partial_open_hour).make_call();
              call.set_value(val);
              call.perform();
            }

    - topic: dooya/schedule/partial_minute/set
      then:
        - lambda: |-
            int val = atoi(x.c_str());
            if (val >= 0 && val <= 59) {
              auto call = id(partial_open_minute).make_call();
              call.set_value(val);
              call.perform();
            }

    - topic: dooya/schedule/partial_seconds/set
      then:
        - lambda: |-
            int val = atoi(x.c_str());
            if (val >= 1 && val <= 40) {
              auto call = id(partial_open_seconds).make_call();
              call.set_value(val);
              call.perform();
            }

    - topic: dooya/schedule/full_hour/set
      then:
        - lambda: |-
            int val = atoi(x.c_str());
            if (val >= 0 && val <= 23) {
              auto call = id(full_open_hour).make_call();
              call.set_value(val);
              call.perform();
            }

    - topic: dooya/schedule/full_minute/set
      then:
        - lambda: |-
            int val = atoi(x.c_str());
            if (val >= 0 && val <= 59) {
              auto call = id(full_open_minute).make_call();
              call.set_value(val);
              call.perform();
            }

# --- Time source (standalone schedule, no Home Assistant) --------------------

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Bangkok
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

# --- Schedule check (runs every minute, compares against configurable times) --
# Uses stored number values instead of hard-coded times.
# Assumption: curtain is normally fully closed at partial open time.

interval:
  - interval: 60s
    then:
      - lambda: |-
          if (!id(schedule_enabled).state) return;
          
          auto time = id(sntp_time).now();
          if (!time.is_valid()) return;
          
          int current_hour = time.hour;
          int current_minute = time.minute;
          
          // Check partial open time
          int partial_hour = (int)id(partial_open_hour).state;
          int partial_minute = (int)id(partial_open_minute).state;
          if (current_hour == partial_hour && current_minute == partial_minute) {
            int duration_ms = (int)(id(partial_open_seconds).state * 1000);
            ESP_LOGI("schedule", "Partial open triggered at %02d:%02d — opening for %ds",
                     current_hour, current_minute, (int)id(partial_open_seconds).state);
            id(handle_open).execute();
            id(scheduled_stop).execute();
          }
          
          // Check full open time
          int full_hour = (int)id(full_open_hour).state;
          int full_minute = (int)id(full_open_minute).state;
          if (current_hour == full_hour && current_minute == full_minute) {
            ESP_LOGI("schedule", "Full open triggered at %02d:%02d", current_hour, current_minute);
            id(handle_open).execute();
          }

  # Check for full travel completion (every 500ms while moving)
  - interval: 500ms
    then:
      - lambda: |-
          if (id(movement_direction) == 0) return;
          
          uint32_t now = millis();
          uint32_t elapsed = now - id(movement_start_ms);
          const uint32_t TRAVEL_TIME_MS = 40000;  // 40 seconds
          
          if (elapsed >= TRAVEL_TIME_MS) {
            // Full travel completed - position is now known
            if (id(movement_direction) == 1) {
              id(curtain_position) = 100.0;
              ESP_LOGI("position", "Full open complete - position now KNOWN at 100%%");
            } else {
              id(curtain_position) = 0.0;
              ESP_LOGI("position", "Full close complete - position now KNOWN at 0%%");
            }
            id(position_known) = true;
            id(movement_direction) = 0;
            id(publish_position).execute();
          }

# --- SPI + CC1101 (native, async ASK/OOK) ------------------------------------

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  cs_pin:
    number: GPIO5
    ignore_strapping_warning: true  # wiring already done on GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK

remote_transmitter:
  pin: GPIO4  # GDO0
  carrier_duty_percent: 100%
  non_blocking: true  # ESP32 RMT default; set explicitly to silence warning
  on_transmit:
    then:
      - lambda: "id(is_transmitting) = true;"
      - cc1101.begin_tx
  on_complete:
    then:
      - lambda: "id(is_transmitting) = false;"
      - cc1101.begin_rx

remote_receiver:
  pin: GPIO16  # GDO2
  dump:
    - dooya
  tolerance: 50%
  filter: 250us
  idle: 7ms
  on_dooya:
    then:
      - lambda: |-
          // Ignore our own transmissions
          if (id(is_transmitting)) {
            ESP_LOGD("rf", "Ignoring own transmission");
            return;
          }
          
          // Debounce: ignore commands within 300ms of last one
          uint32_t now = millis();
          if (now - id(last_rf_command_ms) < 300) {
            ESP_LOGD("rf", "Ignoring repeat frame");
            return;
          }
          id(last_rf_command_ms) = now;
          
          // Only respond to our remote (id 0x009C4B85, channel 5)
          if (x.id != 0x009C4B85 || x.channel != 5) {
            ESP_LOGD("rf", "Ignoring different remote: id=0x%08X channel=%d", x.id, x.channel);
            return;
          }
          
          // Ignore long-press/held frames (check 12-15)
          if (x.check >= 12 && x.check <= 15) {
            ESP_LOGD("rf", "Ignoring held frame: check=%d", x.check);
            return;
          }
          
          ESP_LOGI("rf", "Remote command received: button=%d check=%d", x.button, x.check);
          
          // Handle remote buttons (don't transmit - the remote already did)
          if (x.button == 1) {
            // OPEN pressed on physical remote
            id(handle_open_no_tx).execute();
          } else if (x.button == 5) {
            // STOP pressed on physical remote
            id(handle_stop_no_tx).execute();
          } else if (x.button == 3) {
            // CLOSE pressed on physical remote
            id(handle_close_no_tx).execute();
          }

# =============================================================================
# CAPTURED CODES — DC1600 remote, channel 5
# =============================================================================
# id: 0x009C4B85, channel: 5
# OPEN:  button 1, check 1
# STOP:  button 5, check 5
# CLOSE: button 3, check 3
#
# Frames with check 12-15 seen at burst tail are long-press/held frames; ignored.
# =============================================================================

substitutions:
  dooya_id: "0x009C4B85"
  dooya_channel: "5"

# --- Scripts (shared by buttons, cover, and schedule) ------------------------

script:
  # Transmit OPEN and update position tracking
  - id: transmit_open
    then:
      - remote_transmitter.transmit_dooya:
          id: ${dooya_id}
          channel: ${dooya_channel}
          button: 1
          check: 1
          repeat:
            times: 3
            wait_time: 15ms

  # Transmit STOP
  - id: transmit_stop
    then:
      - remote_transmitter.transmit_dooya:
          id: ${dooya_id}
          channel: ${dooya_channel}
          button: 5
          check: 5
          repeat:
            times: 3
            wait_time: 15ms

  # Transmit CLOSE
  - id: transmit_close
    then:
      - remote_transmitter.transmit_dooya:
          id: ${dooya_id}
          channel: ${dooya_channel}
          button: 3
          check: 3
          repeat:
            times: 3
            wait_time: 15ms

  # Handle OPEN command (transmit + track position)
  - id: handle_open
    then:
      - script.execute: transmit_open
      - script.execute: handle_open_no_tx

  # Handle OPEN without transmitting (for physical remote detection)
  - id: handle_open_no_tx
    then:
      - lambda: |-
          id(movement_start_ms) = millis();
          id(movement_start_position) = id(curtain_position);
          id(start_position_was_known) = id(position_known);
          id(movement_direction) = 1;  // opening
          ESP_LOGI("position", "OPEN started (position %s at %.0f%%)",
                   id(position_known) ? "known" : "unknown", id(curtain_position));
      - script.execute: publish_position

  # Handle STOP command (transmit + calculate position)
  - id: handle_stop
    then:
      - script.execute: transmit_stop
      - script.execute: handle_stop_no_tx

  # Handle STOP without transmitting (for physical remote detection)
  - id: handle_stop_no_tx
    then:
      - lambda: |-
          if (id(movement_direction) == 0) {
            ESP_LOGD("position", "STOP while already stopped");
            return;
          }
          
          uint32_t elapsed_ms = millis() - id(movement_start_ms);
          const float TRAVEL_TIME_MS = 40000.0;
          float travel_percent = (elapsed_ms / TRAVEL_TIME_MS) * 100.0;
          
          if (id(start_position_was_known)) {
            // Calculate new position from known starting point
            float new_pos;
            if (id(movement_direction) == 1) {
              // Was opening
              new_pos = id(movement_start_position) + travel_percent;
              if (new_pos > 100.0) new_pos = 100.0;
            } else {
              // Was closing
              new_pos = id(movement_start_position) - travel_percent;
              if (new_pos < 0.0) new_pos = 0.0;
            }
            id(curtain_position) = new_pos;
            id(position_known) = true;
            ESP_LOGI("position", "STOP after %lums (%.0f%% travel) - position KNOWN at %.0f%%",
                     (unsigned long)elapsed_ms, travel_percent, new_pos);
          } else {
            // Started from unknown position - still unknown
            ESP_LOGI("position", "STOP after %lums - position still UNKNOWN",
                     (unsigned long)elapsed_ms);
          }
          
          id(movement_direction) = 0;
      - script.execute: publish_position

  # Handle CLOSE command (transmit + track position)
  - id: handle_close
    then:
      - script.execute: transmit_close
      - script.execute: handle_close_no_tx

  # Handle CLOSE without transmitting (for physical remote detection)
  - id: handle_close_no_tx
    then:
      - lambda: |-
          id(movement_start_ms) = millis();
          id(movement_start_position) = id(curtain_position);
          id(start_position_was_known) = id(position_known);
          id(movement_direction) = -1;  // closing
          ESP_LOGI("position", "CLOSE started (position %s at %.0f%%)",
                   id(position_known) ? "known" : "unknown", id(curtain_position));
      - script.execute: publish_position

  # Delayed stop for partial open schedule
  - id: scheduled_stop
    mode: restart
    then:
      - delay: !lambda "return (int)(id(partial_open_seconds).state * 1000);"
      - script.execute: handle_stop

  # Publish position state to MQTT
  - id: publish_position
    then:
      - lambda: |-
          // Publish position (only meaningful if known)
          char pos_str[8];
          snprintf(pos_str, sizeof(pos_str), "%.0f", id(curtain_position));
          id(mqtt_client).publish("dooya/curtain/position", pos_str, 0, true);
          
          // Publish confidence flag
          id(mqtt_client).publish("dooya/curtain/position_known", 
                                  id(position_known) ? "true" : "false", 0, true);
          
          // Publish movement state
          const char* movement;
          if (id(movement_direction) == 1) {
            movement = "opening";
          } else if (id(movement_direction) == -1) {
            movement = "closing";
          } else {
            movement = "stopped";
          }
          id(mqtt_client).publish("dooya/curtain/movement", movement, 0, true);
          
          // Publish movement start time (for elapsed calculation in UI)
          if (id(movement_direction) != 0) {
            char start_str[16];
            snprintf(start_str, sizeof(start_str), "%lu", id(movement_start_ms));
            id(mqtt_client).publish("dooya/curtain/movement_start_ms", start_str, 0, true);
          }

  # Publish all states to MQTT (called on MQTT connect)
  - id: publish_all_states
    then:
      - script.execute: publish_position
      - mqtt.publish:
          topic: dooya/schedule/state
          payload: !lambda "return id(schedule_enabled).state ? \"ON\" : \"OFF\";"
          retain: true
      - mqtt.publish:
          topic: dooya/schedule/partial_hour
          payload: !lambda "return to_string((int)id(partial_open_hour).state);"
          retain: true
      - mqtt.publish:
          topic: dooya/schedule/partial_minute
          payload: !lambda "return to_string((int)id(partial_open_minute).state);"
          retain: true
      - mqtt.publish:
          topic: dooya/schedule/partial_seconds
          payload: !lambda "return to_string((int)id(partial_open_seconds).state);"
          retain: true
      - mqtt.publish:
          topic: dooya/schedule/full_hour
          payload: !lambda "return to_string((int)id(full_open_hour).state);"
          retain: true
      - mqtt.publish:
          topic: dooya/schedule/full_minute
          payload: !lambda "return to_string((int)id(full_open_minute).state);"
          retain: true
      - logger.log: "Published all states to MQTT"

# --- Schedule toggle (persisted across reboots) ------------------------------

switch:
  - platform: template
    name: "Morning Schedule"
    id: schedule_enabled
    icon: mdi:calendar-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Toggle from web UI, HA, or MQTT to enable/disable schedule automation.
    on_turn_on:
      - mqtt.publish:
          topic: dooya/schedule/state
          payload: "ON"
          retain: true
    on_turn_off:
      - mqtt.publish:
          topic: dooya/schedule/state
          payload: "OFF"
          retain: true

# --- Schedule settings (configurable times, persisted across reboots) ---------

number:
  - platform: template
    name: "Partial Open Hour"
    id: partial_open_hour
    icon: mdi:clock-outline
    optimistic: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    restore_value: true
    unit_of_measurement: "h"
    on_value:
      - mqtt.publish:
          topic: dooya/schedule/partial_hour
          payload: !lambda "return to_string((int)x);"
          retain: true

  - platform: template
    name: "Partial Open Minute"
    id: partial_open_minute
    icon: mdi:clock-outline
    optimistic: true
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: "m"
    on_value:
      - mqtt.publish:
          topic: dooya/schedule/partial_minute
          payload: !lambda "return to_string((int)x);"
          retain: true

  - platform: template
    name: "Partial Open Seconds"
    id: partial_open_seconds
    icon: mdi:timer-outline
    optimistic: true
    min_value: 1
    max_value: 40
    step: 1
    initial_value: 20
    restore_value: true
    unit_of_measurement: "s"
    on_value:
      - mqtt.publish:
          topic: dooya/schedule/partial_seconds
          payload: !lambda "return to_string((int)x);"
          retain: true

  - platform: template
    name: "Full Open Hour"
    id: full_open_hour
    icon: mdi:clock-outline
    optimistic: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 9
    restore_value: true
    unit_of_measurement: "h"
    on_value:
      - mqtt.publish:
          topic: dooya/schedule/full_hour
          payload: !lambda "return to_string((int)x);"
          retain: true

  - platform: template
    name: "Full Open Minute"
    id: full_open_minute
    icon: mdi:clock-outline
    optimistic: true
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 30
    restore_value: true
    unit_of_measurement: "m"
    on_value:
      - mqtt.publish:
          topic: dooya/schedule/full_minute
          payload: !lambda "return to_string((int)x);"
          retain: true

# --- Buttons (manual control from ESPHome web / HA) --------------------------

button:
  - platform: template
    name: "Curtain Open"
    icon: mdi:curtains
    on_press:
      - script.execute: handle_open

  - platform: template
    name: "Curtain Stop"
    icon: mdi:stop
    on_press:
      - script.execute: handle_stop

  - platform: template
    name: "Curtain Close"
    icon: mdi:curtains-closed
    on_press:
      - script.execute: handle_close

# --- Cover entity (proper HA cover with open/close/stop) ---------------------
# Note: The time_based cover's internal position estimate is separate from
# our position tracking with confidence. The cover entity is kept for HA
# compatibility but our MQTT position topics are the source of truth.

cover:
  - platform: time_based
    name: "Curtains"
    device_class: curtain

    # Measured travel time: 40 seconds for full open/close.
    open_duration: 40s
    close_duration: 40s

    open_action:
      - script.execute: handle_open
    close_action:
      - script.execute: handle_close
    stop_action:
      - script.execute: handle_stop

    # Motor has built-in end stops; no need to send stop at end of travel.
    has_built_in_endstop: true
    # Show both open/close buttons since position is estimated.
    assumed_state: true
