# =============================================================================
# Dooya DC1600 CAPTURE + TRANSMIT node — ESP32 DevKit V1 (30-pin) + CC1101 433 MHz
# =============================================================================
#
# Purpose: capture RF codes from a Dooya DC1600 remote AND transmit cloned
# commands to control curtains. Works standalone (no Home Assistant required)
# with a built-in morning schedule. This does NOT pair with the motor; it
# clones existing remote codes.
#
# Hardware (VERIFY SILKSCREEN — DevKit V1 pin labels vary by clone):
#   ESP32 DevKit V1 30-pin  +  CC1101 8-pin 433 MHz module
#
#   Power: 3V3 ONLY — do NOT connect VCC to 5V (will damage the CC1101).
#   Antenna: attach / enable the antenna (or ~17.3 cm straight wire) before TX.
#
#   CC1101 pin  ->  ESP32 GPIO
#   -----------     ----------
#   VCC         ->  3V3
#   GND         ->  GND
#   SCK / CLK   ->  GPIO18
#   MOSI        ->  GPIO23
#   MISO        ->  GPIO19
#   CSN / CS    ->  GPIO5   (strapping pin warning suppressed; wiring done)
#   GDO0        ->  GPIO4   (remote_transmitter data)
#   GDO2        ->  GPIO16  (remote_receiver data)
#
# Requirements:
#   ESPHome >= 2025.12 (native `cc1101` component, async ASK/OOK mode)
#
# Secrets (create secrets.yaml alongside this file, or use REPLACE_ME below):
#   wifi_ssid, wifi_password
#   api_encryption_key   # openssl rand -base64 32  (also used for OTA)
#
# Captured codes (DC1600 remote, channel 5):
#   id: 0x009C4B85, channel: 5
#   OPEN:  button 1, check 1
#   STOP:  button 5, check 5
#   CLOSE: button 3, check 3
# =============================================================================

esphome:
  name: dooya-dc1600-capture
  friendly_name: "Dooya DC1600 Capture"
  on_boot:
    priority: -100
    then:
      - cc1101.begin_rx

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# --- Network / API / OTA -----------------------------------------------------

wifi:
  ssid: !secret wifi_ssid          # or: "REPLACE_ME_WIFI_SSID"
  password: !secret wifi_password  # or: "REPLACE_ME_WIFI_PASSWORD"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key  # or: "REPLACE_ME_BASE64_32_BYTES"

ota:
  - platform: esphome
    # Encryption reuses the API key; no separate password needed.
    encryption:

web_server:
  port: 80

# --- Time source (standalone schedule, no Home Assistant) --------------------

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Bangkok
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      # 07:00 daily: open curtains to ~50% (halfway).
      # Assumption: curtain is normally fully closed at 07:00.
      # Because the time_based cover can't know true position after reboot or
      # manual remote use, we send OPEN for 20s (half of 40s full travel), then
      # STOP. If already open, motor stays at current position after STOP.
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - if:
              condition:
                switch.is_on: schedule_enabled
              then:
                - logger.log: "Schedule: 07:00 — opening to 50%"
                - script.execute: transmit_open
                - delay: 20s
                - script.execute: transmit_stop

      # 09:30 daily: fully open curtains.
      # Just sends OPEN; motor has built-in endstop so excess travel is safe.
      - seconds: 0
        minutes: 30
        hours: 9
        then:
          - if:
              condition:
                switch.is_on: schedule_enabled
              then:
                - logger.log: "Schedule: 09:30 — opening fully"
                - script.execute: transmit_open

# --- SPI + CC1101 (native, async ASK/OOK) ------------------------------------

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  cs_pin:
    number: GPIO5
    ignore_strapping_warning: true  # wiring already done on GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK

remote_transmitter:
  pin: GPIO4  # GDO0
  carrier_duty_percent: 100%
  non_blocking: true  # ESP32 RMT default; set explicitly to silence warning
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

remote_receiver:
  pin: GPIO16  # GDO2
  dump:
    - dooya
  tolerance: 50%
  filter: 250us
  idle: 7ms

# =============================================================================
# CAPTURED CODES — DC1600 remote, channel 5
# =============================================================================
# id: 0x009C4B85, channel: 5
# OPEN:  button 1, check 1
# STOP:  button 5, check 5
# CLOSE: button 3, check 3
#
# Frames with check 12-15 seen at burst tail are long-press/held frames; ignored.
# =============================================================================

substitutions:
  dooya_id: "0x009C4B85"
  dooya_channel: "5"

# --- Scripts (shared by buttons and cover) -----------------------------------

script:
  - id: transmit_open
    then:
      - remote_transmitter.transmit_dooya:
          id: ${dooya_id}
          channel: ${dooya_channel}
          button: 1
          check: 1
          repeat:
            times: 3
            wait_time: 15ms

  - id: transmit_stop
    then:
      - remote_transmitter.transmit_dooya:
          id: ${dooya_id}
          channel: ${dooya_channel}
          button: 5
          check: 5
          repeat:
            times: 3
            wait_time: 15ms

  - id: transmit_close
    then:
      - remote_transmitter.transmit_dooya:
          id: ${dooya_id}
          channel: ${dooya_channel}
          button: 3
          check: 3
          repeat:
            times: 3
            wait_time: 15ms

# --- Schedule toggle (persisted across reboots) ------------------------------

switch:
  - platform: template
    name: "Morning Schedule"
    id: schedule_enabled
    icon: mdi:calendar-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Toggle from web UI or HA to enable/disable 07:00 and 09:30 automation.

# --- Buttons (manual control from ESPHome web / HA) --------------------------

button:
  - platform: template
    name: "Curtain Open"
    icon: mdi:curtains
    on_press:
      - script.execute: transmit_open

  - platform: template
    name: "Curtain Stop"
    icon: mdi:stop
    on_press:
      - script.execute: transmit_stop

  - platform: template
    name: "Curtain Close"
    icon: mdi:curtains-closed
    on_press:
      - script.execute: transmit_close

# --- Cover entity (proper HA cover with open/close/stop) ---------------------
# time_based cover estimates position from travel time.
# Measure your curtain's actual open/close duration and adjust below.

cover:
  - platform: time_based
    name: "Curtains"
    device_class: curtain

    # Measured travel time: 40 seconds for full open/close.
    open_duration: 40s
    close_duration: 40s

    open_action:
      - script.execute: transmit_open
    close_action:
      - script.execute: transmit_close
    stop_action:
      - script.execute: transmit_stop

    # Motor has built-in end stops; no need to send stop at end of travel.
    has_built_in_endstop: true
    # Show both open/close buttons since position is estimated.
    assumed_state: true

web_server:
  port: 80
